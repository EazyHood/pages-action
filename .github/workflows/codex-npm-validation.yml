---
name: Verify npm dependency extraction
on:
  push:
    branches: [validate-1178]
permissions:
  contents: read
jobs:
  extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run focused regression tests and Ruby style checks
        run: |
          bundle exec ruby -e 'ARGV << "--no-cov"; require_relative "test/pages/test_renovate"; ARGV.delete("--no-cov")'
          bundle exec rubocop test/pages/test_renovate.rb
      - name: Validate Renovate configuration
        run: npx --yes --package=renovate renovate-config-validator renovate.json
      - name: Extract real npm pins with Renovate
        env:
          LOG_LEVEL: debug
          LOG_FORMAT: json
        run: |
          npx --yes --package=renovate renovate --platform=local --dry-run=extract > extraction.jsonl
          python3 - <<'PY'
          import json
          records = []
          for line in open('extraction.jsonl'):
              try:
                  records.append(json.loads(line))
              except json.JSONDecodeError:
                  pass
          files = []
          for record in records:
              for group in record.get('packageFiles', {}).values():
                  files.extend(group)
          found = {item['packageFile']: {dep['depName'] for dep in item['deps']} for item in files if item.get('managerData', {}).get('managerIndex') == 0 or any(dep.get('datasource') == 'npm' for dep in item.get('deps', []))}
          print(json.dumps(found, default=list, indent=2))
          assert found['makes/install.sh'] == {'@eslint/js', 'eslint', 'uglify-js', 'sass', 'stylelint', 'stylelint-config-standard', 'html-minifier'}, found
          assert found['.github/workflows/stylelint.yml'] == {'stylelint', 'stylelint-config-standard'}, found
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-extraction-evidence
          path: extraction.jsonl
