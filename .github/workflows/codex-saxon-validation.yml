---
name: Verify Saxon rendering
on:
  push:
    branches: [validate-909]
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install build dependencies and the Saxon distribution
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils tidy tree
          make install
          java -jar target/saxon.jar -?
      - name: Build assets and run the entire Ruby test suite
        run: |
          make assets
          for fixture in tests/*.yml; do
            name=$(basename "${fixture}" .yml)
            make "target/html/${name}.html"
          done
          bundle exec ruby -e 'ARGV << "--no-cov"; Dir["test/**/test_*.rb"].sort.each { |file| require_relative file }; ARGV.delete("--no-cov")'
          bundle exec rubocop test/pages/test_makefile.rb test/test_entry_size.rb
      - name: Render and verify every integration fixture
        run: make entries
      - name: Validate Renovate configuration
        run: npx --yes --package=renovate renovate-config-validator renovate.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: saxon-rendered-fixtures
          path: |
            target/html/
            target/output/
